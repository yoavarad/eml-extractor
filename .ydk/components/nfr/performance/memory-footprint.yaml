$schema: ydk:schema:nfr
id: ydk:nfr:performance/memory-footprint
description: >-
  Memory ceiling for extraction (ADR-015). Target; not implemented (Stage 02). Today no RAM is measured. Allocation
  rates in docs/perf-results.md imply about 3.9 allocated bytes per input byte for the 1 MB attachment message
  (1,363 MB/s at 259/s on 1,351,406 B) and about 6.8 for the 20 KB HTML message (2,893 MB/s at 16,881/s on 25,433 B).
  Per project owner (2026-10-18), measure first. Task #51 set the numbers below from measured data plus headroom; they
  stay PROVISIONAL because the data is synthetic-only, short-window, from one Windows machine (22 cores); see
  docs/perf-results.md section "Provisional limits (#51)".
category: performance
tags: [memory, baseline]
target: >-
  PROVISIONAL (synthetic only, short windows, single Windows machine, 22 cores). A (allocated bytes per input byte)
  <= 32 on the synthetic set: measured 22.5-26.3 over 7 short sweeps (docs/perf-baseline.json plus local re-runs,
  both GC modes; max 26.27), about 20% headroom. The earlier placeholder 8 was below every measurement and is
  withdrawn; the synthetic set is dominated by tiny messages, which inflate A (the 1 MB attachment message was about
  3.9, docs/perf-results.md). Peak working-set growth for one extraction of a maxInputBytes input <= 6 x
  maxInputBytes: M measured 1.3-4.2 in the large-file pass (#49, run at a 150 MiB input, about 730 MB peak working set; the default is now the OWNER-SET 500 MiB, M not re-measured there, ceiling 3 GB per extraction),
  about 40% headroom over the max 4.2. M < ceiling, so streaming stays DEFERRED (docs/specs/scope.md). Both limits
  need re-checking on the public corpus and on target hardware.
measurement: >-
  A = GC allocated-bytes delta over the sweep window / input bytes processed. Large-file pass (ADR-015): generated
  messages at 25%, 50%, and 100% of maxInputBytes, each with one base64 attachment, extracted on one thread after a
  forced full GC; working set sampled at a fixed interval (50 ms, kept; PROVISIONAL, P(n) run-to-run spread was 4-11%); M = (peak - pre-run working set) /
  input bytes.
test_method: >-
  Same run as ydk:nfr:performance/throughput-dop-sweep ; warn-only regression when A or P(ProcessorCount) rises by
  more than the threshold (20%, kept; PROVISIONAL: A spread 2-10% and P spread 4-11% across 7 short sweeps, so 20% is about 2x the noise)
  versus the comparable baseline. If the measured M exceeds the ceiling of 6, streaming moves from DEFERRED to IN scope (docs/specs/scope.md).
monitoring: none (library; no runtime telemetry)
applies_to:
  - ydk:contract:api/eml-extractor
  - ydk:req:extraction/max-input-size
