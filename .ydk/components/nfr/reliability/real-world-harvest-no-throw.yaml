$schema: ydk:schema:nfr
id: ydk:nfr:reliability/real-world-harvest-no-throw
description: >-
  Real-world corpus content produces no exceptions: detector + extractor run over every local public mail sample
  under the gitignored corpus/internal/ and no call throws or records an internal_error warning (ADR-023/ADR-026:
  content problems are warnings; an exception or an internal_error warning on real mail means a library bug; the probe
  skips files over 40 MB, below maxInputBytes).
  Last recorded harvest (2026-09-15, second pass): 12,853 detected messages, 0 throws, 0 parse_failed, 0 warnings,
  ~3,500 extract/s (README, docs/edge-cases.md). ADR-026 (implemented): a bug inside Extract returns a result with an
  internal_error warning instead of throwing, so the probe also counts internal_error warnings and the target covers
  them too (0 exceptions and 0 internal_error warnings). Harvest probe over corpus/internal could not be run in this checkout (the gitignored corpus is absent); the 12,853-message run predates ADR-026 and must be repeated where the corpus exists. Sources: SpamAssassin 2003/2005, Nazario phishing mboxes,
  cw-l/email-corpus, MimeKit TestData, Apache POI HMEF, php-mime-mail-parser, ProtonMail, Tika, GroupDocs, Chatwoot.
category: reliability
tags: [harvest, robustness]
target: 0
unit: exceptions thrown per harvest run
measurement: >-
  dotnet run --project tools/GoldenKit -c Release -- probe [dir]; Probe walks files (mbox files split per message),
  skips files larger than 40 MB, and tallies detected / throws (any exception) /
  parse_failed / warnings, and counts internal_error warnings as failures (ADR-026).
test_method: >-
  Run probe after any change to the library or a MimeKit upgrade, with corpus/internal/ populated locally.
  Not runnable in CI (samples are not committed: licences and PII vary).
monitoring: none (library; no runtime telemetry)
applies_to:
  - ydk:contract:api/eml-detector
  - ydk:contract:api/eml-extractor
  - ydk:req:extraction/no-throw-on-malformed
