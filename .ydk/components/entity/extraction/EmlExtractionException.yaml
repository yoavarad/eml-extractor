$schema: ydk:schema:entity
id: ydk:entity:extraction/EmlExtractionException
description: >-
  Exception thrown when an unexpected (non-content) exception occurs inside detection, i.e. a library bug. ADR-023,
  per project owner 2026-10-18 (type #104): public sealed class EmlExtractionException : Exception, in
  src/EmlExtraction. Not used for misuse (ArgumentException family), for
  ydk:entity:extraction/EmlInputTooLargeException , for OutOfMemoryException, or for exceptions thrown by host
  callbacks (MeterListener, ActivityListener); those propagate unwrapped.
  ADR-026 (owner decision 2026-11-04): Extract never throws this type; a bug inside extraction becomes
  ydk:warning:extraction/internal-error on a partial result. Only EmlDetector.Detect / IsEml throw it (stage detect).
  The type, its Stage values and its message format are unchanged, so no public API was removed.
fields:
  Stage:
    type: enum
    values: [request, detect, parse, metadata, body, attachments]
    required: true
    nullable: false
    description: >-
      The stage that failed, using the ADR-020 stage names (ADR-021's eml_extraction.stage tag uses parse, metadata,
      body, attachments).
  InnerException:
    type: Exception
    required: true
    nullable: false
    description: The original exception, unchanged (type and stack trace preserved).
  Message:
    type: string
    required: true
    nullable: false
    constraints: >-
      "EML extraction failed in stage '${Stage}': ${InnerExceptionTypeFullName}." The inner exception's message is not
      copied (MimeKit messages can quote input); it stays on InnerException.
    description: Human-readable message naming the stage and the original exception type.
state_transitions: {}
relationships: []
indexes: []
crud: []
