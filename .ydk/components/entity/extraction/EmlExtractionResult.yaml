$schema: ydk:schema:entity
id: ydk:entity:extraction/EmlExtractionResult
description: >-
  Immutable record returned by every Extract call. Source: src/EmlExtraction/Models.cs
  (public sealed record EmlExtractionResult). In-memory value object, not persisted.
  Target change (ADR-014; not implemented, Stage 02): the XFields property is removed and its value lives only in
  Metadata["xfields"].
fields:
  Metadata:
    type: IReadOnlyDictionary<string, string>
    required: true
    nullable: false
    description: >-
      Header map; key set and value formats defined by ydk:entity:extraction/Metadata . Target: always holds
      from, to, cc, bcc, xfields, also on ydk:warning:extraction/parse-failed and
      ydk:warning:extraction/input-too-large (ydk:req:metadata/canonical-keys). Today it is empty on parse_failed.
  XFields:
    type: string
    required: true
    nullable: false
    default: ""
    constraints: >-
      Current code only; removed by ADR-014 (Stage 02). Lines 'Field: value' joined by \n, in header order,
      for X- and X_ headers; target value and rule are Metadata["xfields"] per ydk:req:metadata/xfields .
    description: Concatenation of every X- / X_ header line (current behaviour).
  MainContent:
    type: string
    required: true
    nullable: true
    constraints: >-
      Decoded text of the selected body part with trailing CR/LF trimmed; HTML is kept as markup.
      null when no selectable body part exists, when body decode fails, on parse failure, or on input_too_large.
    description: Main body selected per ydk:req:content/main-content-selection .
  MainContentMimeType:
    type: string
    required: true
    nullable: true
    constraints: "MIME type of the selected part, e.g. text/html, text/plain, text/calendar; null when MainContent is null"
    description: Media type of MainContent.
  Attachments:
    type: IReadOnlyList<ExtractedAttachment>
    required: true
    nullable: false
    default: []
    fk: ydk:entity:extraction/ExtractedAttachment
    description: Flat list of collected parts in MIME tree order; see ydk:req:attachments/attachment-record .
  Warnings:
    type: IReadOnlyList<string>
    required: true
    nullable: false
    default: []
    constraints: "Each item formatted per ydk:crosscut:core/warning-format"
    description: Non-fatal diagnostics recorded during extraction (ydk:req:extraction/no-throw-on-malformed).
  SubjectDirection:
    type: enum
    values: [ltr, rtl]
    required: false
    default: ltr
    description: >-
      Paragraph direction of the subject (init-only property); see ydk:req:content/text-direction . Target: the only
      place this value is reported (no metadata key, ADR-016).
  ContentDirection:
    type: enum
    values: [ltr, rtl]
    required: false
    default: ltr
    description: >-
      Paragraph direction of MainContent (init-only property); see ydk:req:content/text-direction . Target: the only
      place this value is reported (no metadata key, ADR-016).
state_transitions: {}
relationships:
  - entity: ydk:entity:extraction/ExtractedAttachment
    type: one-to-many
    fk: Attachments
    description: A result owns zero or more attachment records.
  - entity: ydk:entity:extraction/Metadata
    type: one-to-one
    fk: Metadata
    description: A result owns exactly one metadata map.
indexes: []
crud: []
