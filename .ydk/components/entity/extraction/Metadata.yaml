$schema: ydk:schema:entity
id: ydk:entity:extraction/Metadata
description: >-
  The header map exposed as EmlExtractionResult.Metadata. Built by HeaderMapper.Map (src/EmlExtraction/Logics/HeaderMapper.cs).
  Keys are ordinal (case-sensitive) strings. This manifest describes the target per ADR-014 and ADR-016
  (ydk:req:metadata/canonical-keys); not implemented (Stage 02).
  Target construction order: (1) every top-level header copied under its canonical key; (2) the classic overlay
  rewrites the value of its own key; (3) xfields computed; (4) any missing fixed key (from, to, cc, bcc, xfields)
  added with "". On ydk:warning:extraction/parse-failed (oversized input throws, ADR-023, so it has no map) the map holds only
  the five fixed keys with "".
  Today (differences): raw keys fold "-" to "_" (x_mailer, reply_to); the overlay adds second punctuation-free keys
  (replyto, sender, messageid, inreplyto, mimeversion, contenttype = top-level MIME type, returnpath, deliveredto);
  subject_direction and content_direction are added last; there is no xfields key; the map is empty on parse_failed.
fields:
  "<canonical header name>":
    type: string
    required: false
    nullable: false
    constraints: >-
      Key = header field name trimmed and lower-cased (invariant); "-" and "_" kept (DKIM-Signature -> dkim-signature,
      X-Mailer -> x-mailer, X_Custom -> x_custom). Value = MimeKit-decoded header value (RFC 2047 decoded, unfolded).
      Repeated headers with the same key are joined with \n in order. A header named xfields (any case) is stored
      under "header:xfields".
    description: Generic entry for every header present in the message (ydk:req:metadata/all-headers).
  from:
    type: string
    required: true
    nullable: false
    default: ""
    constraints: >-
      Parsed mailbox list formatted "Name <addr>" (or "addr" when no display name), groups "Group: m1; m2;", joined "; ".
      If MimeKit parsed no mailbox: raw header value kept. If header absent or parse_failed: "".
    description: Always present (ydk:req:metadata/classic-fields).
  to:
    type: string
    required: true
    nullable: false
    default: ""
    constraints: Same formatting and fallback as from.
    description: Always present.
  cc:
    type: string
    required: true
    nullable: false
    default: ""
    constraints: Same formatting and fallback as from.
    description: Always present.
  bcc:
    type: string
    required: true
    nullable: false
    default: ""
    constraints: Same formatting and fallback as from.
    description: Always present.
  xfields:
    type: string
    required: true
    nullable: false
    default: ""
    constraints: >-
      Lines "<original field name>: <decoded value>" for every header whose name starts with exactly "X_"
      (ordinal), in header order, joined by \n, no trailing newline; "" when none (ydk:req:metadata/xfields).
    description: Always present. The brief's xfields field (ADR-014).
  reply-to:
    type: string
    required: false
    constraints: Formatted like from when the parsed list is non-empty; otherwise the raw value. Present only when the header is.
    description: Reply-To overlay (today key replyto, plus raw reply_to).
  sender:
    type: string
    required: false
    constraints: MimeKit Sender mailbox ToString() when parsed; otherwise the raw value. Present only when the header is.
    description: Sender overlay.
  subject:
    type: string
    required: false
    constraints: Decoded, unfolded subject. Present only when the header is.
    description: Subject.
  date:
    type: string
    required: false
    constraints: ISO 8601 round-trip format ("o") of the parsed Date; the raw value when it does not parse. Present only when the header is.
    description: Date overlay.
  message-id:
    type: string
    required: false
    constraints: Message-ID without angle brackets (MimeKit MessageId); the raw value when it does not parse.
    description: Message-ID overlay (today key messageid, plus raw message_id).
  in-reply-to:
    type: string
    required: false
    constraints: MimeKit InReplyTo without angle brackets; the raw value when it does not parse.
    description: In-Reply-To overlay (today key inreplyto, plus raw in_reply_to).
  references:
    type: string
    required: false
    constraints: Message-IDs without angle brackets joined by a single space; the raw value when none parse.
    description: References overlay.
state_transitions: {}
relationships: []
indexes: []
crud: []
