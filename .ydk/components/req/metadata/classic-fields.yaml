$schema: ydk:schema:req
id: ydk:req:metadata/classic-fields
description: >-
  Original spec "Classic fields (To, From, etc.)". The classic envelope headers are exposed under fixed,
  punctuation-free keys, and the four address keys are always present (ADR-005).
type: business-rule
priority: critical
rule: >-
  Metadata contains the overlay keys listed in ydk:entity:extraction/Metadata with the formats given there.
  from, to, cc, bcc are present in every successful extraction: parsed mailbox list if any, else the raw header
  value, else "". Every other overlay key is set only when its value is non-blank, and when set it overwrites the
  raw-header entry with the same key.
failure_behavior: >-
  Not a failure path: absent headers yield "" for the four address keys and no key for the others.
  On ydk:warning:extraction/parse-failed the whole map is empty.
related_components:
  - ydk:entity:extraction/Metadata
  - ydk:contract:api/eml-extractor
acceptance_criteria:
  - A message with only From/To yields cc == "" and bcc == "" (ExtractionTests.FromToCcBccAreAlwaysPresent)
  - Multiple addresses and Hebrew/Arabic display names survive in from/to/cc/bcc (ExtractsFromToCcBccIncludingMultiplesAndRtlNames)
  - A raw Bcc header in the file is extracted (RawBccHeaderIsExtracted)
  - Two Received headers are both present in received (DuplicateReceivedAreConcatenated)
  - SMTPUTF8 addresses with a Hebrew display name decode (Smtputf8Addresses)
  - Golden rfc5322 slice passes 160/160
