$schema: ydk:schema:req
id: ydk:req:attachments/tnef-unwrap
description: >-
  Outlook winmail.dat (TNEF) is unpacked to flat attachments - peeling the Outlook wrapper, not parsing Office content
  (docs/requirements.md note; ADR-008).
type: business-rule
priority: medium
rule: >-
  A part MimeKit recognises as TNEF is replaced by the files returned from TnefPart.ExtractAttachments, each walked with
  the same rules as top-level parts; the TNEF container itself is not reported. Requires CodePagesEncodingProvider
  (registered by the extractor's static constructor).
failure_behavior: >-
  Unpack failure records ydk:warning:extraction/tnef-extract-failed and reports the raw TNEF part as one attachment.
related_components:
  - ydk:entity:extraction/ExtractedAttachment
  - ydk:library:deps/mimekit
acceptance_criteria:
  - Zimbra Outlook 11 tnef.msg yields no attachment named winmail.dat and a non-empty "upload" file, with no warnings (InternalCorpusTests.ZimbraOutlookTnefUnpacksGifAttachments, when sample present)
  - Apache POI quick-winmail.dat yields an OLE .doc and a PDF (PoiTnefUnpacksRealOleDocAndPdf, when sample present)
  - Public harvest: 82 TNEF-header mails, 0 left as opaque winmail.dat (docs/edge-cases.md E17)
