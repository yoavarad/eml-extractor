$schema: ydk:schema:req
id: ydk:req:quality/realistic-attachment-samples
description: >-
  Brief correctness B (Office files, other emails, attached and pasted images) proven in CI on realistic samples
  (ADR-018). Target; not implemented (Stage 02). Today CI uses typed stubs and the real samples sit only in the
  gitignored corpus/internal/, where absent-sample tests pass vacuously.
type: policy
priority: critical
rule: >-
  corpus/realistic/ is committed and always run in CI. It contains at least one sample of each kind: .docx, .xlsx,
  .pptx, .doc, .xls, PDF, attached Outlook .msg item, attached .eml, TNEF winmail.dat holding an Office file, attached
  image, Outlook-style pasted inline image (image001.png@01D... Content-ID), Gmail-style pasted inline image.
  Each sample is either a public file under MIT, Apache-2.0, BSD, CC0, or CC-BY, or generated by open-source tooling
  from a committed script. corpus/realistic/manifest.json holds per sample: file, source URL or generator script,
  license, SHA-256, expected subfiles (FileName, SizeInBytes, SHA-256, FullPath). Expected values come from generator
  inputs or published source contents, never from extractor output or prose. Tests over uncommittable samples report
  Skipped, naming the missing path, when the sample is absent; they never report Passed without running.
failure_behavior: >-
  A sample without provenance or license is rejected in review; a test that passes without its sample is a defect.
related_components:
  - ydk:test:quality/realistic-samples.integration
  - ydk:test:quality/internal-corpus.integration
  - ydk:req:quality/golden-independence
  - ydk:req:quality/license-notices
acceptance_criteria:
  - CI runs ydk:test:quality/realistic-samples.integration with every kind listed in the rule present
  - Every manifest.json entry has non-empty source, license, and sha256, and the file's SHA-256 matches
  - With corpus/internal/ absent, the internal-corpus tests show as Skipped in the test report, not Passed
