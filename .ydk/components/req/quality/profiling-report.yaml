$schema: ydk:schema:req
id: ydk:req:quality/profiling-report
description: >-
  A committed per-stage profiling report exists before any optimization (ADR-020, per project owner 2026-10-18).
  Target; not implemented (Stage 02). Top-N size and run lengths are provisional until the first profile.
type: policy
priority: medium
rule: >-
  docs/perf/profile-<YYYY-MM-DD>.md is committed and contains: the ADR-015 hardware block per run (a run that cannot
  read the CPU model fails); TFM (net8.0 and net10.0, or a stated reason for one) and GC mode; inputs (ADR-015 public
  corpus mix via --corpus, synthetic set, large-file set, and the fixed per-stage messages); tools with versions and
  licenses (BenchmarkDotNet MemoryDiagnoser, ThreadingDiagnoser, EventPipeProfiler; dotnet-trace; dotnet-counters;
  dotnet-gcdump; optional PerfView - all open source); per stage (request, detect, parse, metadata, body, attachments)
  CPU share and allocation share; GC gen0/gen1/gen2 counts, total pause time, LOH bytes, and the attachment copy factor
  (byte[] bytes allocated in the attachments stage / decoded attachment bytes); and a top-N hotspot table
  (provisional N = 10) with columns rank, stage, % CPU, alloc share, suspected cause, evidence. Release builds only.
  Raw traces are not committed; the report names them. Numbers are compared with docs/perf-baseline.json only when it
  is comparable (ADR-015).
failure_behavior: >-
  Not a runtime rule. No optimization task may start without a committed report row showing its hotspot
  (ydk:req:quality/optimization-evidence ).
related_components:
  - ydk:nfr:performance/throughput-dop-sweep
  - ydk:nfr:performance/memory-footprint
  - ydk:req:quality/optimization-evidence
  - ydk:req:quality/net8-multi-targeting
  - ydk:contract:api/eml-extractor
  - ydk:contract:api/eml-detector
acceptance_criteria:
  - docs/perf/profile-<date>.md exists with hardware block, tool and license table, per-stage table per TFM, GC and LOH figures, copy factor, and a top-N hotspot table
  - Every hotspot row names its stage and its evidence (trace frame or benchmark row)
  - The per-stage benchmarks and the scripted trace run reproduce the report from the documented commands
