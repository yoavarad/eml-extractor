$schema: ydk:schema:test
id: ydk:test:quality/seed-golden.integration
description: >-
  Data-driven golden test, tests/EmlExtraction.Tests/GoldenTests.cs. Discovers every expected.json under the
  copied corpus/golden/seed/ folder (12 cases: E01-emoji, E02-hebrew, E03-html-alt, E04-win1255, E05-docx, E06-nested,
  E07-png-attach, E08-cid, E09-folded, E10-xfields, E13-empty, E19-ole) and runs detector + extractor on input.eml.
  The same expectation format drives the 1200-case bulk score in tools/GoldenKit (ydk:nfr:reliability/golden-pass-rate).
level: integration
target: ydk:contract:api/eml-extractor
cases:
  - name: SeedGoldenMatches
    description: One theory row per seed case
    given: input.eml and authored expected.json (is_eml, metadata eq/contains/not_contains, xfields, main_content, main_content_mime_type, attachment_count, attachments with name/size/sha256/disposition/full_path/reextract)
    when: IsEml then (if is_eml) Extract are called
    then: Detector result equals is_eml; every expectation holds; nested attachments with reextract are extracted again and checked recursively
stubs: []
never_mock:
  - EmlDetector
  - EmlExtractor
  - Golden files (read from disk, never regenerated by the extractor - ydk:req:quality/golden-independence)
