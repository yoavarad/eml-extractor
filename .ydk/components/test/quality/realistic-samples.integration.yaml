$schema: ydk:schema:test
id: ydk:test:quality/realistic-samples.integration
description: >-
  Correctness B over the committed realistic samples (ydk:req:quality/realistic-attachment-samples , ADR-018).
  Target; not implemented (Stage 02). Data-driven from corpus/realistic/manifest.json; runs in CI.
level: integration
target: ydk:contract:api/eml-extractor
cases:
  - name: RealisticSampleMatchesManifest
    description: One theory row per manifest entry
    given: A committed sample and its manifest entry (expected subfiles with FileName, SizeInBytes, SHA-256, FullPath)
    when: Detect then Extract are called with the sample bytes
    then: IsSupported true; every expected subfile present with exact FileName, SizeInBytes, SHA-256, FullPath; no internal_error warning
  - name: TnefSubfilesCarryContainerPath
    description: TNEF origin is visible
    given: The winmail.dat sample holding an Office file
    when: Extract is called
    then: The Office file's FullPath starts with "winmail.dat/" and no attachment named winmail.dat remains
  - name: PastedImagesMatchHtmlCid
    description: Outlook and Gmail paste shapes
    given: The two pasted-image samples
    when: Extract is called
    then: Each image's ContentId appears as a cid reference in MainContent and its SHA-256 equals the manifest value
  - name: AttachedMessagesStayOpaque
    description: Attached .eml and .msg are files, not recursed
    given: The attached .eml and attached Outlook .msg samples
    when: Extract is called
    then: Each is exactly one attachment with the manifest SHA-256; no inner part is promoted
  - name: ManifestProvenanceComplete
    description: Provenance and license recorded
    given: corpus/realistic/manifest.json
    when: The test reads every entry
    then: source, license, and sha256 are non-empty, the license is in the allowed list, and the file hash matches
stubs: []
never_mock:
  - EmlDetector
  - EmlExtractor
  - Sample files (committed real or tool-generated bytes, never synthesised in the test)
