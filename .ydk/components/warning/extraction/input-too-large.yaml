$schema: ydk:schema:warning
id: ydk:warning:extraction/input-too-large
description: >-
  DEPRECATED - removed by ADR-023 (per project owner 2026-10-18): input over maxInputBytes now throws
  ydk:entity:extraction/EmlInputTooLargeException carrying InputLength and MaxInputBytes, and no result is returned.
  This manifest records the superseded #38 behaviour, which stays in code until the Stage 02 throw batch
  (docs/plans/stage-02-throw-batch.yaml) deletes the warning; then this manifest is deleted too.
  Superseded behaviour: the input is longer than the extractor's maxInputBytes limit (ydk:req:extraction/max-input-size). Implemented
  in #38.
code: input_too_large
message_template: "input_too_large: ${InputBytes} > ${MaxInputBytes}"
triggers:
  - EmlExtractionRequest.FileBytes.Length is greater than maxInputBytes
result_effect: >-
  Nothing is parsed. Metadata holds only from, to, cc, bcc, xfields, each ""; MainContent null; MainContentMimeType
  null; no attachments; SubjectDirection and ContentDirection ltr; Warnings holds only this warning.
related:
  - ydk:contract:api/eml-extractor
  - ydk:crosscut:core/warning-format
  - ydk:req:extraction/max-input-size
