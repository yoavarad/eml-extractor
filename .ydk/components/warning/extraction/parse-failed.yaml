$schema: ydk:schema:warning
id: ydk:warning:extraction/parse-failed
description: >-
  The whole-message parse, or the mapping that follows it, threw one of the caught exception types:
  FormatException, MimeKit ParseException, IOException, InvalidOperationException, ArgumentException,
  NotSupportedException, DecoderFallbackException. Any other exception type is a library bug and is thrown as
  ydk:entity:extraction/EmlExtractionException with stage parse (ADR-023). Target, not yet implemented (ADR-026):
  such a bug returns the same empty result with ydk:warning:extraction/internal-error (detail parse) instead, and a
  content exception after parsing never gives parse_failed (one metadata key gives
  ydk:warning:extraction/metadata-field-failed ).
code: parse_failed
message_template: "parse_failed: ${ExceptionTypeName}: ${ExceptionMessage}"
triggers:
  - MimeKit cannot parse the header block or MIME structure of the buffer
  - A caught exception type is raised anywhere inside Extract(ReadOnlyMemory<byte>) after parsing (header mapping, body selection, attachment collection)
result_effect: >-
  Metadata holds only from, to, cc, bcc, xfields, each "" (ADR-016). MainContent null, MainContentMimeType null,
  no attachments, SubjectDirection and ContentDirection at their default ltr, and Warnings holding any
  warnings recorded before the failure followed by this one.
related:
  - ydk:contract:api/eml-extractor
  - ydk:entity:extraction/EmlExtractionResult
  - ydk:crosscut:core/warning-format
