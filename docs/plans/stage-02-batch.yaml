    description: >-
      Size S. HeaderMapper.IsXHeader: name.StartsWith("X_", StringComparison.Ordinal) only; x_foo, X-Foo, x-foo do not
      match. Value: '<original name>: <decoded unfolded value>' per occurrence, header order, joined by \n, no trailing
      newline; "" when none. Remove EmlExtractionResult.XFields. Update the Exchange header test (X-MS-* lines now in
      general metadata; rename InternalCorpusTests.ExchangeMegaHeadersLandInXFields -> ExchangeMegaHeadersLandInMetadata)
      and seed E10 + bulk x-headers cases from the catalog. Not blocked by team-questions Q5: the owner chose the literal
      rule as default.
      Goldens: on a corpus/golden conflict, rebase and re-run `dotnet run --project tools/GoldenKit -- gen`;
      never hand-merge goldens.
    acceptance:
      - "Headers X_A: 1, X-B: 2, x_c: 3, X_A: 4 -> Metadata['xfields'] == \"X_A: 1\\nX_A: 4\"; x-b and x_c under their own keys"
      - "Message with only X- headers -> xfields == \"\""
      - "EmlExtractionResult has no XFields member"
      - "Seed E10 and x-headers bulk cases regenerated from the catalog; GoldenKit score 1212/1212"
    test_strategy: >-
      TDD in ExtractionTests (literal-prefix matrix, ordering, repeat, empty) first; rename/adjust internal-corpus test.
      dotnet test; GoldenKit gen + score.
    depends_on:
      - "T-metadata-keys:blocks"

  # ======================= E-robustness =======================
  - id: T-no-throw
    title: "Per-stage guards with internal_error warning in both Extract paths; tests and GoldenKit fail on internal_error"
    story: S-no-throw
    component_refs:
      - ydk:req:extraction/no-throw-on-malformed
      - ydk:warning:extraction/internal-error
      - ydk:crosscut:core/warning-format
      - ydk:contract:api/eml-extractor
      - ydk:req:content/main-content-selection
      - ydk:warning:extraction/body-decode-failed
      - ydk:warning:extraction/part-decode-failed
      - ydk:warning:extraction/rfc822-extract-failed
      - ydk:warning:extraction/tnef-extract-failed
      - ydk:nfr:reliability/real-world-harvest-no-throw
    spec_refs:
      - extraction.md
      - cross-cutting.md
      - docs/adrs/004-warnings-not-exceptions.md
    description: >-
      Size M. In EmlExtractor: parse step keeps parse_failed for the known parse exceptions (empty result = fixed-key
      helper from T-metadata-keys); any other exception during parsing is also caught. After parsing, guard three
      stages separately: metadata (header map + xfields), body (selection + directions), attachments (collection). A
      throwing stage contributes its default (fixed-key metadata / MainContent + MimeType null and both directions ltr /
      no attachments) and appends 'internal_error: <stage>: <ExceptionTypeName>: <message>' after earlier warnings;
      other stages keep their output. Same for the internal MimeMessage overload. ArgumentNullException still thrown.
      Provide an internal test seam (e.g. internal stage-fault hook, InternalsVisibleTo) to inject a throw per stage.
      Tests: a shared assertion/xunit fixture that fails any test whose result has an internal_error warning;
      GoldenKit score and probe count internal_error and exit non-zero on any. Known per-part warnings unchanged.
      Error-model divergence with OLE (team-questions Q1) does NOT block this task.
      Goldens: on a corpus/golden conflict, rebase and re-run `dotnet run --project tools/GoldenKit -- gen`;
      never hand-merge goldens.
    acceptance:
      - "Injected throw in metadata stage: Metadata == fixed keys only, body and attachments intact, exactly one internal_error warning naming 'metadata' and the exception type"
      - "Same for body stage (MainContent null, directions ltr) and attachments stage (no attachments)"
      - "A non-listed exception during parse (injected) gives a result, not a throw"
      - "MimeMessage overload behaves identically (test via InternalsVisibleTo)"
      - "GoldenKit score/probe exit non-zero when any result has internal_error (verified with the fault seam)"
      - "All existing tests and GoldenKit score 1212/1212 with zero internal_error"
    test_strategy: >-
      TDD: fault-injection tests per stage and per overload first (red), implement guards. Add the global internal_error
      check to test helpers. GoldenKit score + probe (probe over corpus/internal when present locally).
    depends_on:
      - "T-request-api:blocks"
      - "T-metadata-keys:blocks"

  - id: T-size-guard
    title: "maxInputBytes constructor option with input_too_large warning (provisional default 150 MiB)"
    story: S-size-guard
    component_refs:
      - ydk:req:extraction/max-input-size
