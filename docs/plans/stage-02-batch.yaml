      <= 0 -> ArgumentOutOfRangeException. In Extract(request), before parsing: FileBytes.Length > limit -> return the
      fixed-key empty result (T-metadata-keys helper), MainContent null, no attachments, directions ltr, one warning
      'input_too_large: <length> > <limit>'. Length == limit is parsed. Bytes overload inherits it via forwarding.
      Detector not limited. Expose the default as a public const for the load test's large-file pass.
      Goldens: on a corpus/golden conflict, rebase and re-run `dotnet run --project tools/GoldenKit -- gen`;
      never hand-merge goldens.
    acceptance:
      - "maxInputBytes 1024: 1025-byte message -> exactly one warning starting 'input_too_large', fixed keys only, no attachments"
      - "maxInputBytes 1024: 1024-byte message extracted normally"
      - "new EmlExtractor(0) and new EmlExtractor(-1) throw ArgumentOutOfRangeException"
      - "Default instance accepts a 157286400-byte input and rejects 157286401 (test allocates once; mark [Trait(\"Category\",\"Large\")] if slow)"
      - "GoldenKit score 1212/1212"
    test_strategy: >-
      TDD in ExtractionTests: boundary tests at limit-1/limit/limit+1 with a small limit, ctor validation, default
