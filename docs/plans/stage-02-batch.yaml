# Stage 02 batch: decomposition of the ADR-004/011..019 target work into epics, stories, tasks.
# NOTE (2026-10-18): ADR-023 replaces the internal_error / input_too_large warnings and the "never throws" rule
# referenced below with exceptions; see docs/plans/stage-02-throw-batch.yaml. Issues already created are not edited here.
# Validate:  ydk task create-batch --from docs/plans/stage-02-batch.yaml --dry-run
#
# Planning conventions (apply to every task below):
# - Existing items are NOT recreated: epic #8, story #9, task #10 ("Normalize repo structure and config to .NET
#   conventions"). Task "10" is referenced as a dependency: it adds Directory.Packages.props, splits Models.cs into one
#   type per file, dedupes the golden schema and fixes corpus path resolution, so every task that edits a csproj,
#   package versions, Models.cs, the golden schema or GoldenKit waits for it.
# - Goldens policy (decision for item 14): each behaviour-changing task updates the GoldenKit catalog/generator/scorer,
#   regenerates corpus/golden (bulk + seed) from the catalog (ADR-007: never from extractor output) and keeps the score
#   at 1212/1212 cases in the SAME PR. No separate "fix goldens" task: the CI golden gate (T-golden-gate, lands first)
#   would otherwise be red between PRs. If two PRs both regenerate corpus/golden/bulk, resolve the conflict by
#   rebasing and re-running `dotnet run --project tools/GoldenKit -- gen`, never by hand-merging expected.json.
#   A deliberate re-baseline (case count changes) must be called out in the PR and in docs/golden-score.txt.
# - TDD: write the failing test first (dotnet test), then code. Every code task ends with: dotnet build -warnaserror,
#   dotnet format --verify-no-changes, dotnet test (net8.0 and net10.0 once T-net8 has landed), GoldenKit score 1212/1212,
#   and zero internal_error warnings once T-no-throw has landed.
# - Team questions (docs/team-questions.md): no task is blocked. Q4 (license) was answered by the owner on 2026-10-18:
#   MIT, "Copyright (c) 2026 Yoav Arad". The error-model divergence (Q1), template integration (Q2), framework
#   timeline (Q3) and X_ usage (Q5) do NOT block any task; each has a recorded default that the tasks implement.
# - No human gates (owner, 2026-10-18). T-load-baseline is blocked by every contract/behaviour task so the baseline
#   measures shipped code; the agent runs the sweep on the owner's machine, pointing --corpus at the main checkout's
#   gitignored corpus/internal.

epics:
  - id: E-contract
    title: "Shared extractor contract: request, detection result, sub-file fields, metadata keys"
    description: >-
      Implement the breaking API change of ADR-012, ADR-013, ADR-014 and ADR-016 in one release while the library has
      no consumers: EmlExtractionRequest, EmlDetector.Detect, shared sub-file names and container FullPath, canonical
      metadata keys and literal X_ xfields in the metadata. Goldens are regenerated from the catalog in the same PRs.
    spec_refs:
      - overview.md
      - extraction.md
      - attachments.md
      - detection.md
      - docs/adrs/012-shared-team-extractor-contract.md
      - docs/adrs/013-fullpath-is-container-path.md
      - docs/adrs/014-xfields-literal-x-underscore.md
      - docs/adrs/016-canonical-metadata-keys.md

  - id: E-robustness
    title: "Robust extraction: per-stage no-throw contract and input-size guard"
    description: >-
      Close the ADR-004 gap (unexpected exceptions escape Extract) with per-stage guards and an internal_error warning,
      and add the configurable input-size guard with the input_too_large warning.
    spec_refs:
      - extraction.md
      - cross-cutting.md
      - docs/adrs/004-warnings-not-exceptions.md

  - id: E-quality
    title: "Quality evidence: full golden gate in CI, realistic samples, emoji fidelity"
    description: >-
      Make CI prove correctness A and B from the brief: full GoldenKit score as a CI gate (ADR-011), committed licensed
      realistic samples run in CI with absent internal samples reported as Skipped (ADR-018), and exact-equality emoji
      and combining-sequence cases (unicode-fidelity).
    spec_refs:
      - quality.md
      - testing.md
      - docs/adrs/011-gate-ci-on-full-golden-score.md
      - docs/adrs/018-committed-realistic-samples.md

  - id: E-load
    title: "Load test and hardware sizing (ADR-015)"
    description: >-
      Replace the single-thread bench and the guessed 0.7 contention factor with a measured DOP sweep (both GC modes,
      memory, hardware block, sizing formula), a committed baseline with a warn-only nightly, and then set every
      provisional limit (maxInputBytes default, memory ceiling, thresholds) from the measured data.
    spec_refs:
      - quality.md
      - docs/adrs/015-load-test-method.md

  - id: E-platform
    title: "Open source, platform targets and hand-off docs"
    description: >-
      MIT license and third-party notices (ADR-017), net8.0 + net10.0 multi-targeting with CI on both (ADR-019), the
      brief's C# capability assessment, and fixing doc/tooling drift including the README for the new API.
    spec_refs:
      - overview.md
      - scope.md
      - glossary.md
      - docs/adrs/017-mit-license.md
      - docs/adrs/019-multi-target-net8-net10.md

stories:
  # ---------------- E-contract ----------------
  - id: S-api-surface
    title: "Caller extracts via EmlExtractionRequest and gets a typed detection result"
    epic: E-contract
    description: >-
      As the team template, I call EmlDetector.Detect(bytes) for {IsSupported, MimeType} (IsEml kept) and
      EmlExtractor.Extract(EmlExtractionRequest) as the primary method; Extract(ReadOnlyMemory<byte>) stays as a thin
      wrapper and Extract(MimeMessage) is internal, so no MimeKit type is public (ADR-012).
    spec_refs:
      - extraction.md
      - detection.md
      - cross-cutting.md
      - docs/adrs/012-shared-team-extractor-contract.md
    component_refs:
      - ydk:contract:api/eml-detector
      - ydk:contract:api/eml-extractor
      - ydk:entity:extraction/EmlDetectionResult
      - ydk:entity:extraction/EmlExtractionRequest
      - ydk:crosscut:core/library-surface
    acceptance:
      - "Detect(bytes).IsSupported == IsEml(bytes) for every detector unit case and every golden detection case; MimeType is message/rfc822 when supported, else empty string"
      - "Extract(new EmlExtractionRequest(bytes, name)) and Extract(bytes) return identical results and warnings for every seed and bulk golden case"
      - "FileName on the request never changes the result"
      - "Extract(null request) throws ArgumentNullException"
      - "Public API (reflection test) exposes no MimeKit type; Extract(MimeMessage) is internal"
      - "GoldenKit score stays 1212/1212"

  - id: S-subfiles
    title: "Each attachment carries the shared sub-file fields and a unique container FullPath"
    epic: E-contract
    description: >-
      As the factory, every attachment has FileName, SizeInBytes, FullPath, BinaryData (+ ContentId, Disposition,
      OriginalPath, ContentLocation); FullPath is the always-set, per-result-unique container path such as
      winmail.dat/budget.xlsx (ADR-012, ADR-013).
    spec_refs:
      - attachments.md
      - docs/adrs/012-shared-team-extractor-contract.md
      - docs/adrs/013-fullpath-is-container-path.md
    component_refs:
      - ydk:entity:extraction/ExtractedAttachment
      - ydk:req:attachments/attachment-record
      - ydk:req:attachments/container-path
      - ydk:req:attachments/tnef-unwrap
    acceptance:
      - "ExtractedAttachment exposes FileName, SizeInBytes, FullPath (non-null), BinaryData, ContentId, Disposition, OriginalPath, ContentLocation; Name/Size/Data are gone"
      - "Top-level attachment: FullPath == FileName; TNEF-unpacked file: FullPath == '<wrapper FileName>/<FileName>'; nameless wrapper uses winmail.dat"
      - "Parts named image001.png, image001.png, image001~2.png get FullPaths image001.png, image001~3.png, image001~2.png"
      - "FullPath is unique per result under ordinal case-insensitive comparison; FileName is never changed by de-duplication"
      - "Path-bearing sender filename ../../etc/passwd.txt gives FileName passwd.txt, OriginalPath ../../etc/passwd.txt, FullPath passwd.txt"
      - "Golden expectations regenerated from the catalog; score 1212/1212"

  - id: S-metadata
    title: "Metadata has one canonical key per header and the literal X_ xfields field"
    epic: E-contract
    description: >-
      As the indexer, every header appears once under its lower-cased name (no '-'/'_' folding), classic headers are
      overlaid in place, direction values are only result properties, the fixed keys from/to/cc/bcc/xfields are always
      present, and Metadata["xfields"] joins only headers starting with literal 'X_' (ADR-014, ADR-016).
    spec_refs:
      - extraction.md
      - docs/adrs/014-xfields-literal-x-underscore.md
      - docs/adrs/016-canonical-metadata-keys.md
    component_refs:
      - ydk:entity:extraction/Metadata
      - ydk:entity:extraction/EmlExtractionResult
      - ydk:req:metadata/canonical-keys
      - ydk:req:metadata/all-headers
      - ydk:req:metadata/classic-fields
      - ydk:req:metadata/xfields
      - ydk:req:content/text-direction
    acceptance:
      - "X-Foo and X_Foo headers land under x-foo and x_foo with their own values"
      - "message-id, reply-to, dkim-signature keys exist; messageid, replyto, contenttype, subject_direction, content_direction do not"
      - "from, to, cc, bcc, xfields present (\"\" when unknown) in every result including parse_failed"
      - "Metadata[\"xfields\"] contains only headers whose name starts with ordinal 'X_', one 'Name: value' line each, joined by \\n; X- headers are absent from it"
      - "EmlExtractionResult has no XFields property"
      - "Golden expectations regenerated from the catalog; score 1212/1212"

  # ---------------- E-robustness ----------------
  - id: S-no-throw
    title: "Extraction never throws on content and reports library bugs as internal_error"
    epic: E-robustness
    description: >-
      As the batch pipeline, one bad message never aborts a batch: each stage (metadata, body+direction, attachments)
      is guarded, a failing stage yields its empty default plus one internal_error warning, the other stages keep their
      output, and tests/GoldenKit fail on any internal_error (ADR-004).
    spec_refs:
      - extraction.md
      - cross-cutting.md
      - docs/adrs/004-warnings-not-exceptions.md
    component_refs:
      - ydk:req:extraction/no-throw-on-malformed
      - ydk:warning:extraction/internal-error
      - ydk:crosscut:core/warning-format
    acceptance:
      - "An injected exception in any one stage gives one 'internal_error: <stage>: <ExceptionType>: ...' warning, that stage's default, and the other stages' output"
      - "Both the request method and the internal MimeMessage overload follow the same contract"
      - "Null argument still throws ArgumentNullException"
      - "dotnet test and GoldenKit score/probe fail when any result carries internal_error"

  - id: S-size-guard
    title: "Inputs over a host-set size limit are refused with input_too_large"
    epic: E-robustness
    description: >-
      As the host, I set maxInputBytes when constructing EmlExtractor (provisional default 150 MiB); longer inputs are
      not parsed and return the fixed-key empty result with input_too_large.
    spec_refs:
      - extraction.md
      - cross-cutting.md
    component_refs:
      - ydk:req:extraction/max-input-size
      - ydk:warning:extraction/input-too-large
    acceptance:
      - "maxInputBytes 1024: 1025-byte input gives exactly one input_too_large warning, fixed keys only, no attachments; 1024-byte input is extracted normally"
      - "new EmlExtractor(0) throws ArgumentOutOfRangeException"
      - "Default limit accepts exactly 157286400 bytes and rejects one more; both Extract overloads apply it"

  # ---------------- E-quality ----------------
  - id: S-golden-gate
    title: "CI fails on any failed golden case across all 1212 cases"
    epic: E-quality
    spec_refs:
      - quality.md
      - testing.md
      - docs/adrs/011-gate-ci-on-full-golden-score.md
    component_refs:
      - ydk:nfr:reliability/golden-pass-rate
      - ydk:req:quality/golden-independence
    acceptance:
      - "CI runs GoldenKit score over all 1200 bulk + 12 seed cases on net10.0 on every PR and push to main"
      - "A PR that breaks one golden case fails CI"

  - id: S-realistic
    title: "CI proves correctness B on committed, licensed realistic samples; absent internal samples show as Skipped"
    epic: E-quality
    spec_refs:
      - quality.md
      - testing.md
      - attachments.md
      - docs/adrs/018-committed-realistic-samples.md
    component_refs:
      - ydk:req:quality/realistic-attachment-samples
      - ydk:test:quality/realistic-samples.integration
      - ydk:test:quality/internal-corpus.integration
    acceptance:
      - "corpus/realistic/ holds OOXML (docx/xlsx/pptx), legacy .doc/.xls, PDF, attached .msg, attached .eml, TNEF winmail.dat holding an OOXML file, attached image, Outlook- and Gmail-style pasted inline images"
      - "corpus/realistic/manifest.json records file, source URL or generator script, license, SHA-256 and expected values for every sample"
      - "Expected values come from generator inputs or published contents, never from extractor output"
      - "Realistic-sample tests run in CI on every PR"
      - "With corpus/internal/ absent, every InternalCorpusTests case reports Skipped naming the missing path; none reports Passed"

  - id: S-unicode
    title: "Emoji and combining sequences round-trip exactly"
    epic: E-quality
    spec_refs:
      - extraction.md
      - quality.md
    component_refs:
      - ydk:req:content/unicode-fidelity
      - ydk:test:extraction/exotic-language.unit
    acceptance:
      - "ZWJ family, skin-tone modifier, regional-indicator flag, keycap and combining-mark strings round-trip with ordinal equality in subject, plain body, HTML body and attachment filename"
      - "A ZWJ sequence split across two RFC 2047 encoded-words and an RFC 2231 filename with a flag emoji round-trip exactly"

  # ---------------- E-load ----------------
  - id: S-load-test
    title: "Team can size hardware from a measured DOP sweep with memory and a sizing formula"
    epic: E-load
    spec_refs:
      - quality.md
      - docs/adrs/015-load-test-method.md
    component_refs:
      - ydk:nfr:performance/throughput-dop-sweep
      - ydk:nfr:performance/memory-footprint
    acceptance:
      - "Sweep n=1..ProcessorCount under Workstation and Server GC reports T(n), P50/P95, P(n), A and E(n) per input set and as a mix"
      - "Hardware block present; the run exits non-zero if the CPU model cannot be read"
      - "Large-file pass at 25/50/100% of maxInputBytes and one byte over yields M"
      - "docs/perf-baseline.json committed; comparable runs warn (never fail) past the threshold; nightly CI synthetic run against docs/perf-baseline-ci.json"
      - "Every provisional number in ADR-015, max-input-size and memory-footprint is replaced by a measured value plus headroom with its source run recorded"

  # ---------------- E-platform ----------------
  - id: S-license
    title: "The repo is open source with a license and audited third-party notices"
    epic: E-platform
    spec_refs:
      - overview.md
      - scope.md
      - docs/adrs/017-mit-license.md
    component_refs:
      - ydk:req:quality/license-notices
      - ydk:library:deps/bouncycastle-cryptography
    acceptance:
      - "LICENSE (MIT, 'Copyright (c) 2026 Yoav Arad') at the repo root; ADR-017 Accepted; team-questions Q4 closed"
      - "THIRD-PARTY-NOTICES.md lists all eight packages with version, license, copyright, plus every committed non-authored sample"
      - "CI fails when a restore-graph package is missing from the notices or has a disallowed license"

  - id: S-net8
    title: "A .NET 8 host can load the library; tests pass on net8.0 and net10.0"
    epic: E-platform
    spec_refs:
      - overview.md
      - testing.md
      - docs/adrs/019-multi-target-net8-net10.md
    component_refs:
      - ydk:req:quality/net8-multi-targeting
    acceptance:
      - "src/EmlExtraction and tests/EmlExtraction.Tests target net8.0;net10.0; tools and bench stay net10.0"
      - "CI builds and tests both targets with the .NET 8 runtime installed; the vulnerability audit passes on both"

  - id: S-capability
    title: "The brief's C#-vs-other-language capability assessment exists"
    epic: E-platform
    spec_refs:
      - overview.md
      - docs/research/brief-gap-analysis.md
    component_refs:
      - ydk:req:research/capability-assessment
    acceptance:
      - "docs/research/csharp-capability-assessment.md compares MimeKit/.NET with Python, Java and Go per brief capability, with evidence and license per row and one of the three allowed conclusions"
      - "ADR-001 Alternatives links to it"

  - id: S-docs
    title: "Docs and tooling match the code"
    epic: E-platform
    spec_refs:
      - overview.md
      - glossary.md
      - scope.md
      - detection.md
    component_refs:
      - ydk:req:detection/reject-non-email-magic
      - ydk:crosscut:core/library-surface
    acceptance:
      - "GoldenKit finds the repo root without the removed docs/golden-1200-plan.md marker"
      - "README and specs state that '{', '[' and '<' first bytes are rejected"
      - "docs/golden.md TNEF statement matches what is actually tested"
      - "README documents the Stage 02 API (request, Detect, attachment fields and FullPath, canonical keys, Metadata[\"xfields\"], warnings incl. internal_error and input_too_large, maxInputBytes)"

tasks:
  # ======================= Wave after #10: CI safety net =======================
  - id: T-golden-gate
    title: "CI: run the full GoldenKit score (1212/1212) as a required gate on net10.0"
    story: S-golden-gate
    component_refs:
      - ydk:nfr:reliability/golden-pass-rate
      - ydk:req:quality/golden-independence
      - ydk:test:quality/seed-golden.integration
    spec_refs:
      - quality.md
      - testing.md
      - docs/adrs/011-gate-ci-on-full-golden-score.md
    description: >-
      Size S. Add a step to .github/workflows/ci.yml (build-test job, after Test) that runs
      `dotnet run --project tools/GoldenKit -c Release --no-build -- score` over the committed corpus/golden (1200 bulk +
      12 seed) on net10.0. GoldenKit score already exits non-zero on any failed case; verify that, and make it so if not
      (tools/GoldenKit/Scorer.cs / Program.cs). Upload the score report as an artifact on failure. Do not change
      golden data. Lands right after #10 (which fixes corpus path resolution and dedupes the golden schema) and before
      the contract tasks, so every contract PR is held to 1212/1212.
    acceptance:
      - "CI log shows the GoldenKit score step with 1212/1212 cases"
      - "Flipping one expected value in a bulk expected.json (throwaway branch) makes CI fail at that step"
      - "GoldenKit score exit code is non-zero on any failed case (covered by a test or documented manual check in the PR)"
    test_strategy: >-
      Run GoldenKit score locally (expect 1212/1212, exit 0); on a throwaway branch corrupt one expected.json and
      confirm non-zero exit and a red CI run; existing dotnet test suite unchanged.
    depends_on:
      - "10:blocks"

  - id: T-net8
    title: "Multi-target library and tests to net8.0 + net10.0; CI on both"
    story: S-net8
    component_refs:
      - ydk:req:quality/net8-multi-targeting
      - ydk:crosscut:core/library-surface
      - ydk:library:deps/mimekit
      - ydk:library:deps/system-security-cryptography-pkcs
      - ydk:library:deps/bouncycastle-cryptography
    spec_refs:
      - overview.md
      - testing.md
      - scope.md
      - docs/adrs/019-multi-target-net8-net10.md
    description: >-
      Size M. Set <TargetFrameworks>net8.0;net10.0</TargetFrameworks> in src/EmlExtraction and tests/EmlExtraction.Tests
      (Directory.Build.props default stays net10.0 for tools/GoldenKit and benches). Verify the ADR-019 risks:
      Pkcs 10.0.13 pin restores and passes the audit on net8.0 (else a conditional PackageVersion in
      Directory.Packages.props from #10); MimeKit 4.18.0 behaves the same; no .NET 9/10-only API or language feature
      breaks net8.0 (add #if NET9_0_OR_GREATER or rewrite). CI: install the .NET 8 runtime next to the global.json SDK
      (setup-dotnet with both), run dotnet test for both TFMs (one multi-target run or matrix) and the vulnerable-package
      audit on both. Golden gate stays net10.0. Not blocked by team-questions Q3 (default net8+net10 until the template
      moves).
    acceptance:
      - "dotnet build -warnaserror and dotnet test pass for net8.0 and net10.0 locally and in CI"
      - "CI vulnerability audit passes for both TFMs"
      - "GoldenKit and Bench still net10.0 only"
      - "Public API identical on both targets (same reflection-based API test passes on both)"
    test_strategy: >-
      Existing unit + seed golden suite run per TFM (dotnet test -f net8.0 / -f net10.0); GoldenKit score unchanged
      1212/1212; CI run shows both TFM test results.
    depends_on:
      - "10:blocks"
      - "T-golden-gate:related"

  # ======================= E-contract =======================
  - id: T-detect-result
    title: "Add EmlDetector.Detect returning EmlDetectionResult {IsSupported, MimeType}; keep IsEml"
    story: S-api-surface
    component_refs:
      - ydk:contract:api/eml-detector
      - ydk:entity:extraction/EmlDetectionResult
      - ydk:req:detection/detect-eml
      - ydk:req:detection/reject-non-email-magic
      - ydk:test:detection/detector.unit
    spec_refs:
      - detection.md
      - docs/adrs/012-shared-team-extractor-contract.md
    description: >-
      Size S. New public sealed record EmlDetectionResult (own file, per #10's one-type-per-file rule) with IsSupported
      (bool) and MimeType (string: "message/rfc822" when supported, else ""). EmlDetector.Detect(ReadOnlySpan<byte>)
      returns it; IsEml(data) becomes `Detect(data).IsSupported` (no behaviour change). Detection stays bytes-in, no
      request (ADR-012). Never throws. GoldenKit detection checks may keep using IsEml; add an assertion that Detect
      agrees. No golden data change expected.
      Goldens: on a corpus/golden conflict, rebase and re-run `dotnet run --project tools/GoldenKit -- gen`;
      never hand-merge goldens.
    acceptance:
      - "Every existing DetectorTests case also asserts Detect(x).IsSupported == IsEml(x) and the MimeType rule"
      - "Empty span, 1-byte span and a 20 KB non-mail buffer return IsSupported false, MimeType empty, no throw"
      - "GoldenKit score 1212/1212; detection slice unchanged"
    test_strategy: >-
      TDD in tests/EmlExtraction.Tests/DetectorTests.cs: write Detect tests first (red), implement, then parametrise the
      existing accept/reject cases over both entry points. dotnet test; GoldenKit score.
    depends_on:
      - "10:blocks"
      - "T-golden-gate:blocks"

  - id: T-request-api
    title: "Add EmlExtractionRequest; Extract(request) primary, bytes overload as wrapper, Extract(MimeMessage) internal"
    story: S-api-surface
    component_refs:
      - ydk:contract:api/eml-extractor
      - ydk:entity:extraction/EmlExtractionRequest
      - ydk:crosscut:core/library-surface
      - ydk:req:extraction/mbox-from-line
      - ydk:test:extraction/extraction.unit
    spec_refs:
      - extraction.md
      - cross-cutting.md
      - docs/adrs/012-shared-team-extractor-contract.md
    description: >-
      Size M. Public sealed record EmlExtractionRequest { ReadOnlyMemory<byte> FileBytes (required); string? FileName }
      with an implicit conversion path so byte[] callers compile unchanged (FileBytes accepts byte[] implicitly).
      EmlExtractor.Extract(EmlExtractionRequest) holds all logic; null request -> ArgumentNullException.
      Extract(ReadOnlyMemory<byte>) only builds a request (no FileName) and forwards. Extract(MimeMessage) becomes
      internal; add InternalsVisibleTo for EmlExtraction.Tests, GoldenKit and EmlExtraction.Bench if they use it.
      FileName never affects the result. mbox "From " handling must keep working through the request path. Add a
      reflection test that no public member signature mentions a MimeKit type. Update GoldenKit/bench call sites;
      golden data unchanged. Do not add the size limit or stage guards here (T-size-guard, T-no-throw).
      Goldens: on a corpus/golden conflict, rebase and re-run `dotnet run --project tools/GoldenKit -- gen`;
      never hand-merge goldens.
    acceptance:
      - "For every seed and bulk golden input, Extract(request) and Extract(bytes) results are equal (metadata, body, directions, attachments, warnings)"
      - "Same bytes with FileName null vs 'x.eml' give equal results"
      - "Extract((EmlExtractionRequest)null) throws ArgumentNullException"
      - "Reflection test: no public type/member in EmlExtraction exposes a MimeKit type"
      - "Existing mbox-from-line tests pass via the request path; GoldenKit score 1212/1212"
    test_strategy: >-
      TDD: add request-equivalence and API-surface tests in ExtractionTests (red), implement. GoldenKit gets a
      one-off equivalence check (or test iterating seed cases). dotnet test; GoldenKit score.
    depends_on:
      - "10:blocks"
      - "T-golden-gate:blocks"

  - id: T-subfile-fields
    title: "Rename attachment fields to FileName/SizeInBytes/BinaryData; add OriginalPath and ContentLocation"
    story: S-subfiles
    component_refs:
      - ydk:entity:extraction/ExtractedAttachment
      - ydk:req:attachments/attachment-record
      - ydk:library:deps/mimekit
      - ydk:test:attachments/attachment.unit
    spec_refs:
      - attachments.md
      - cross-cutting.md
      - docs/adrs/012-shared-team-extractor-contract.md
      - docs/adrs/013-fullpath-is-container-path.md
    description: >-
      Size M. In ExtractedAttachment: Name -> FileName, Size -> SizeInBytes, Data -> BinaryData; ContentId and
      Disposition unchanged; add OriginalPath (string?: raw trimmed sender filename when it contains '/' or '\', else
      null; today's FullPath meaning) and ContentLocation (string?: decoded, trimmed Content-Location header via
      MimeEntity.ContentLocation, else null). FullPath keeps today's value in this task (redefined in T-fullpath) so the
      change is a pure rename + two new fields. Update tests, GoldenKit (Scorer/Models/Generator: the path-in-filename
      slice now asserts original_path; add content_location where the catalog knows it, e.g. O2392 cases), bench, and
      regenerate corpus/golden from the catalog. README update is T-readme-api.
      Goldens: on a corpus/golden conflict, rebase and re-run `dotnet run --project tools/GoldenKit -- gen`;
      never hand-merge goldens.
    acceptance:
      - "ExtractedAttachment has FileName, SizeInBytes, BinaryData, OriginalPath, ContentLocation; no Name/Size/Data"
      - "../../etc/passwd.txt sender filename -> FileName passwd.txt, OriginalPath ../../etc/passwd.txt"
      - "A part with Content-Location: images/logo.png reports ContentLocation 'images/logo.png'; absent header -> null"
      - "Golden path-in-filename slice checks original_path; data regenerated from catalog (not extractor); GoldenKit score 1212/1212"
    test_strategy: >-
      TDD in AttachmentTests/ExtractionTests: new OriginalPath and ContentLocation cases first, then mechanical rename.
      dotnet test; GoldenKit gen + score (1212/1212, check count unchanged or deliberately re-baselined in PR text).
    depends_on:
      - "10:blocks"
      - "T-golden-gate:blocks"

  - id: T-fullpath
    title: "FullPath = container path: processing order, TNEF segment, fallback-name sanitising, two-pass ~N de-dupe"
    story: S-subfiles
    component_refs:
      - ydk:req:attachments/container-path
      - ydk:req:attachments/tnef-unwrap
      - ydk:entity:extraction/ExtractedAttachment
      - ydk:test:attachments/attachment.unit
    spec_refs:
      - attachments.md
      - docs/adrs/013-fullpath-is-container-path.md
    description: >-
      Size M (complexity ~6; split candidate if review finds it heavy: ordering+segments vs de-dupe). Implement ADR-013
      exactly in PartCollector: (1) deterministic processing order = depth-first MIME document order, TNEF-unpacked files
      inserted at the wrapper's position in container order; part-<index> uses this order. (2) Segments: TNEF wrapper
      adds its FileName (nameless -> winmail.dat); multipart adds nothing; nested message/rfc822 stays opaque (no
      fwd.eml/... paths). (3) Nameless parts: <content-id>.<subtype> else part-<index>.<subtype> (bin when empty);
      nameless nested message attached.eml; empty/'.'/'..' counts as nameless; in fallback names replace
      / \ : * ? " < > | and U+0000-001F, U+007F with '_'. (4) Two-pass de-dupe: reserve all literal paths, then the
      first keeps, later duplicates get ~n before the last segment's extension (n=2.. smallest free, not in reserved
      set), ordinal case-insensitive (invariant upper). FullPath never null; FileName unchanged. Update GoldenKit
      full_path expectations from the catalog (top-level: equals file name) and regenerate corpus/golden.
      Goldens: on a corpus/golden conflict, rebase and re-run `dotnet run --project tools/GoldenKit -- gen`;
      never hand-merge goldens.
    acceptance:
      - "image001.png, image001.png, image001~2.png -> image001.png, image001~3.png, image001~2.png"
      - "IMAGE.PNG and image.png in one message -> image.png/IMAGE.PNG keeps first, second gets ~2 (case-insensitive uniqueness)"
      - "TNEF wrapper winmail.dat with budget.xlsx -> FullPath winmail.dat/budget.xlsx; nameless wrapper -> winmail.dat/<name>"
      - "Fallback name from Content-ID 'a/b:c' -> 'a_b_c.<subtype>'; nested message stays one opaque attachment with FullPath equal to its FileName"
      - "Every attachment in every golden case has non-null, per-result-unique FullPath; GoldenKit score 1212/1212"
    test_strategy: >-
      TDD: one AttachmentTests case per ADR-013 rule (ordering, TNEF segment, nameless wrapper, sanitising, de-dupe
      example, case-insensitive collision, nested opaque) built with MimeKit builders and a TnefWriter-built winmail.dat.
      Property test over all golden results: FullPath unique per result. GoldenKit gen + score.
    depends_on:
      - "T-subfile-fields:blocks"

  - id: T-metadata-keys
    title: "Canonical metadata keys (ADR-016): lower-cased names, in-place overlay, fixed keys always present, direction out"
    story: S-metadata
    component_refs:
      - ydk:req:metadata/canonical-keys
      - ydk:req:metadata/all-headers
      - ydk:req:metadata/classic-fields
      - ydk:entity:extraction/Metadata
      - ydk:entity:extraction/EmlExtractionResult
      - ydk:req:content/text-direction
      - ydk:warning:extraction/parse-failed
      - ydk:test:extraction/extraction.unit
    spec_refs:
      - extraction.md
      - cross-cutting.md
      - docs/adrs/016-canonical-metadata-keys.md
      - docs/adrs/005-always-emit-address-fields.md
    description: >-
      Size M. HeaderMapper: key = header name trimmed + ToLowerInvariant, nothing else ('-' and '_' kept); repeated
      headers joined with \n in order. Classic overlay writes the parsed form into the header's own key (from, to, cc,
      bcc, reply-to, sender, date ISO 8601 round-trip or raw, message-id, in-reply-to without brackets, references
      space-joined) and adds no second key; remove contenttype/messageid/replyto etc. A header literally named xfields
      (any case) is stored under 'header:xfields'. Remove subject_direction/content_direction from the map (properties
      only). Introduce one helper for the fixed-key empty metadata (from, to, cc, bcc, xfields = "") and use it for
      parse_failed; it is reused by T-no-throw and T-size-guard. Metadata["xfields"] is populated with today's XFields
      string here so the key exists; T-xfields changes the rule and removes the property. Update ExtractionTests,
      GoldenKit catalog/scorer keys and regenerate corpus/golden from the catalog.
      Goldens: on a corpus/golden conflict, rebase and re-run `dotnet run --project tools/GoldenKit -- gen`;
      never hand-merge goldens.
    acceptance:
      - "X-Foo: a and X_Foo: b -> Metadata['x-foo']=='a', Metadata['x_foo']=='b'"
      - "Keys message-id, reply-to, dkim-signature present; messageid, replyto, dkim_signature, contenttype, subject_direction, content_direction absent"
      - "Header 'XFields: q' stored under 'header:xfields'"
      - "parse_failed result: Metadata has exactly from,to,cc,bcc,xfields, each \"\""
      - "Golden data regenerated from catalog; GoldenKit score 1212/1212"
    test_strategy: >-
      TDD in ExtractionTests: collision, overlay-in-place, reserved key, parse_failed fixed keys, direction-not-in-map
      tests first. dotnet test; GoldenKit gen + score.
    depends_on:
      - "10:blocks"
      - "T-golden-gate:blocks"

  - id: T-xfields
    title: "xfields = literal 'X_' headers in Metadata[\"xfields\"]; remove the XFields property"
    story: S-metadata
    component_refs:
      - ydk:req:metadata/xfields
      - ydk:entity:extraction/EmlExtractionResult
      - ydk:entity:extraction/Metadata
      - ydk:test:quality/internal-corpus.integration
