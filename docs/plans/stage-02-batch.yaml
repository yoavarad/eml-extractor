  # ======================= E-load =======================
  - id: T-load-sweep
    title: "Load-test harness: DOP sweep 1..cores, Workstation + Server GC, T(n), P50/P95, peak WS, alloc/byte, E(n), hardware block"
    story: S-load-test
    component_refs:
      - ydk:nfr:performance/throughput-dop-sweep
      - ydk:nfr:performance/memory-footprint
      - ydk:nfr:performance/extract-tiny-throughput
      - ydk:nfr:performance/extract-html-20kb-throughput
      - ydk:nfr:performance/extract-1mb-attachment-throughput
      - ydk:nfr:performance/detect-tiny-throughput
    spec_refs:
      - quality.md
      - docs/adrs/015-load-test-method.md
    description: >-
      Size M (complexity ~6). Extend benches/EmlExtraction.Bench (net10.0) with a `sweep` mode: load all inputs into
      memory (public mail from `--corpus <path>`, default corpus/internal, every file, mbox split per message; synthetic = 5 bench messages + 1212
      golden inputs); for n = 1..Environment.ProcessorCount, n workers pull from a shared index and call Extract
      (detection measured separately); provisional 2 s warm-up, >= 10 s and >= 3 passes window. Per n: T(n), P50/P95
      latency, peak working set sampled every 50 ms, A = allocated-bytes delta / input bytes, E(n) = T(n)/(n*T(1));
      report per set and mix. Run each GC mode in a child process with DOTNET_gcServer set explicitly (never rely on
      the default). Hardware block: CPU model from registry ProcessorNameString / /proc/cpuinfo / sysctl
      machdep.cpu.brand_string (exit non-zero if unreadable; never 'Unknown processor'), physical+logical cores, RAM,
      OS, runtime, TFM, GC mode, date, git commit. Output JSON + markdown. Keep the existing single-thread table in
      docs/perf-results.md as history; drop the 0.7 formula from extract-tiny-throughput usage.
    acceptance:
      - "`dotnet run -c Release --project benches/EmlExtraction.Bench -- sweep --set synthetic` prints T(n), P50, P95, P(n), A, E(n) for n=1..cores under both GC modes"
      - "Hardware block fields all populated; forcing CPU lookup failure exits non-zero"
      - "JSON output schema documented and stable (consumed by T-load-baseline)"
      - "The harness takes a corpus path argument (`--corpus <path>`), so a task worktree can point at the main checkout's gitignored corpus/internal (C:\\Users\\yoava\\Projects\\eml-extraction\\corpus\\internal)"
      - "When the --corpus path is absent or empty, the run prints a visible 'SKIPPED: public corpus not found at <path>' line and reports the set as skipped; it never reports the public set as passed or silently omits it"
    test_strategy: >-
      Unit tests for the pure parts (E(n), percentile, CPU-string parsers per OS fixtures) in a small test class; smoke
      run of the sweep on the synthetic set with a short window flag.
    depends_on:
      - "10:blocks"

  - id: T-load-largefile
    title: "Load test: large-file pass (25/50/100% of maxInputBytes, +1 byte guard check), M, and the sizing formula"
    story: S-load-test
    component_refs:
      - ydk:nfr:performance/memory-footprint
      - ydk:req:extraction/max-input-size
      - ydk:nfr:performance/throughput-dop-sweep
    spec_refs:
      - quality.md
      - docs/adrs/015-load-test-method.md
    description: >-
      Size S-M. Single-thread pass, kept out of the DOP mix: generate messages at 25%, 50%, 100% of the configured
      maxInputBytes, each with one base64 attachment, plus one at limit+1 that must return input_too_large. Forced full
      GC before each; sample working set every 50 ms; M = (peak - pre-run WS) / input bytes. Emit the resource-derivation
      formula with the measured values: cores_needed = ceil(R/(T(1) x E(n))), servers_needed = ceil(R/T(n_best)),
      ram_per_server = P(n_best) + n_best x max_input_bytes x M, with a short "how the team reruns this" section.
    acceptance:
      - "Report shows M and peak WS for 25/50/100% inputs; limit+1 input yields input_too_large and no parse"
      - "Sizing formula printed with measured T(1), E(n), n_best, P(n_best), M"
    test_strategy: "Smoke run with a small --max-input-bytes; unit test for the formula computation."
    depends_on:
      - "T-load-sweep:blocks"
      - "T-size-guard:blocks"

  - id: T-load-baseline
    title: "Commit perf baseline + comparability check + warn-only regression rule + nightly synthetic CI job"
    story: S-load-test
    component_refs:
      - ydk:nfr:performance/throughput-dop-sweep
      - ydk:nfr:performance/memory-footprint
    spec_refs:
      - quality.md
      - docs/adrs/015-load-test-method.md
    description: >-
      Size M. Blocked by every contract/behaviour task so the baseline measures shipped code (owner, 2026-10-18). No
      human gate: the agent runs the full sweep (public corpus + synthetic, both GC modes, net10.0) on this machine,
      passing --corpus C:\Users\yoava\Projects\eml-extraction\corpus\internal (the main checkout's gitignored corpus;
      a task worktree does not have it). Commit docs/perf-baseline.json with the hardware block. Implement compare:
      only when CPU model, logical cores, runtime major.minor and GC mode match, else print
      'baseline not comparable: <field>'; warn (never fail) when T(1) or T(ProcessorCount) drops, or A or
      P(ProcessorCount) rises, by more than the provisional 20%. Add .github/workflows/perf-nightly.yml (schedule +
      workflow_dispatch) running the synthetic set against docs/perf-baseline-ci.json (seeded from the first nightly
      run), warn-only. Best run after the contract tasks land (baseline must reflect the shipped code); refresh rule
      documented in docs/perf-results.md.
    acceptance:
      - "docs/perf-baseline.json committed with full hardware block and all per-DOP metrics for both GC modes"
      - "A run on different hardware prints 'baseline not comparable: <field>' and skips comparison"
      - "A synthetic 25% slowdown (test fixture) prints a warning and exit code 0"
      - "Nightly workflow runs green and uploads its report"
    test_strategy: "Unit tests for comparability and threshold logic with fixture JSON; one manual workflow_dispatch run of the nightly."
    depends_on:
      - "T-load-largefile:blocks"
      - "T-detect-result:blocks"
      - "T-request-api:blocks"
      - "T-subfile-fields:blocks"
      - "T-fullpath:blocks"
      - "T-metadata-keys:blocks"
      - "T-xfields:blocks"
      - "T-no-throw:blocks"
      - "T-size-guard:blocks"
      - "T-net8:blocks"

