# Stage 02 perf batch: profiling (ADR-020), runtime metrics and tracing (ADR-021), data-driven optimization (ADR-022).
# Owner decision 2026-10-18: add BOTH dev-time profiling AND runtime metrics, then optimize from data.
# Validate:  PYTHONUTF8=1 ydk task create-batch --from docs/plans/stage-02-perf-batch.yaml --dry-run
#
# Cross-references to existing issues: create-batch accepts existing issue numbers in depends_on (it validates them
# against `ydk task list` and passes unknown-to-the-file ids through unchanged in pass 2), so "48:blocks" etc. below
# resolve to the existing GitHub issues. No post-creation `ydk task ... --depends-on` commands are needed.
# Existing issues referenced (created from docs/plans/stage-02-batch.yaml, see .ydk/batch-mapping.json):
#   #30 T-net8 (net8.0 + net10.0)          #31 T-detect-result      #32 T-request-api
#   #37 T-no-throw (per-stage guards)      #38 T-size-guard
#   #48 T-load-sweep (sweep harness, --corpus)   #49 T-load-largefile   #50 T-load-baseline   #51 T-load-limits
#
# Planning conventions (in addition to those at the top of stage-02-batch.yaml, which all apply):
# - Every number in ADR-020/021/022 and the new manifests is provisional until measured; the measuring task replaces it
#   with measured value + stated headroom and cites the source run.
# - Bench work: benches/EmlExtraction.Bench multi-targets net8.0;net10.0 for profiling (ADR-020 amends ADR-019 for the
#   bench only). T-profile-harness makes that change and adds BenchmarkDotNet; later bench tasks build on it.
# - Library code tasks keep: dotnet build -warnaserror, dotnet format --verify-no-changes, dotnet test on net8.0 and
#   net10.0, GoldenKit score 1212/1212, zero internal_error warnings.
# - The corpus is gitignored and absent in task worktrees: runs pass
#   --corpus C:\Users\yoava\Projects\eml-extraction\corpus\internal (the main checkout).
# - Optimization tasks are NOT in this file: T-opt-triage creates them with `ydk task create` under S-optimization and
#   links each to T-opt-reprofile with `ydk task create ... --depends-on <T-opt-reprofile id>:related` (or by adding the
#   new id to T-opt-reprofile's dependencies as "related").

epics:
  - id: E-perf
    title: "Performance profiling, observability and optimization"
    description: >-
      After the load test (#48-#51): profile every extraction stage for CPU, allocations, GC and LOH with open-source
      tools and commit a hotspot report (ADR-020); add BCL Meter + ActivitySource runtime telemetry with a hard PII rule
      and a measured overhead budget (ADR-021); then optimize only from the report, one proven change per task, and
      close with a re-run that refreshes the baseline (ADR-022).
    spec_refs:
      - quality.md
      - cross-cutting.md
      - testing.md
      - scope.md
      - docs/adrs/020-profiling-method.md
      - docs/adrs/021-runtime-metrics-and-tracing.md
      - docs/adrs/022-data-driven-optimization.md

stories:
  - id: S-profiling
    title: "Team sees where time and memory go per extraction stage, in a committed hotspot report"
    epic: E-perf
    spec_refs:
      - quality.md
      - docs/adrs/020-profiling-method.md
    component_refs:
      - ydk:req:quality/profiling-report
      - ydk:nfr:performance/throughput-dop-sweep
      - ydk:nfr:performance/memory-footprint
    acceptance:
      - "Per-stage benchmarks (request, detect, parse, metadata, body, attachments) run on net8.0 and net10.0 with MemoryDiagnoser, ThreadingDiagnoser and EventPipeProfiler"
      - "A scripted dotnet-trace / dotnet-counters / dotnet-gcdump run over the ADR-015 corpus mix and large-file set takes --corpus <path>"
      - "docs/perf/profile-<date>.md committed with hardware block, tool licenses, per-stage CPU and alloc shares, GC/LOH figures, copy factor and a top-N hotspot table"

  - id: S-runtime-metrics
    title: "Host can observe extraction at run time through BCL metrics and traces, with no message content and negligible cost"
    epic: E-perf
    spec_refs:
      - cross-cutting.md
      - testing.md
      - docs/adrs/021-runtime-metrics-and-tracing.md
    component_refs:
      - ydk:crosscut:core/observability
      - ydk:req:observability/runtime-telemetry
      - ydk:nfr:observability/metrics-overhead
      - ydk:test:observability/telemetry.unit
    acceptance:
      - "Meter and ActivitySource 'EmlExtraction' emit exactly the ADR-021 instruments and activities on net8.0 and net10.0"
      - "PII guard test proves no message content or request FileName reaches any tag, span or status"
      - "No-listener vs listener benchmark recorded against the provisional budget, which is then set from the measurement"
      - "README documents the names and how to subscribe with OpenTelemetry"

  - id: S-optimization
    title: "Throughput and memory improve through measured, individually proven optimizations"
    epic: E-perf
    spec_refs:
      - quality.md
      - scope.md
      - docs/adrs/022-data-driven-optimization.md
    component_refs:
      - ydk:req:quality/optimization-evidence
      - ydk:req:quality/profiling-report
      - ydk:nfr:performance/memory-footprint
      - ydk:nfr:performance/throughput-dop-sweep
    acceptance:
      - "Every optimization task cites a hotspot row, a hypothesis and an expected gain; targets are relative to the #50 baseline"
      - "Each merged optimization shows before/after on the same machine, golden 1212/1212, tests green on both TFMs"
      - "Closing re-run refreshes the baseline and records the delta per optimization"

tasks:
  # ======================= S-profiling =======================
  - id: T-profile-harness
    title: "Per-stage BenchmarkDotNet profiling harness (Memory/Threading diagnosers, EventPipeProfiler) on net8.0 + net10.0"
    story: S-profiling
    component_refs:
      - ydk:req:quality/profiling-report
      - ydk:req:quality/net8-multi-targeting
      - ydk:nfr:performance/memory-footprint
      - ydk:contract:api/eml-extractor
      - ydk:contract:api/eml-detector
    spec_refs:
      - quality.md
      - docs/adrs/020-profiling-method.md
      - docs/adrs/019-multi-target-net8-net10.md
    description: >-
      Size M (complexity ~6). In benches/EmlExtraction.Bench: set TargetFrameworks net8.0;net10.0 (bench only; ADR-020
      amends ADR-019, GoldenKit stays net10.0) and add BenchmarkDotNet (MIT) via Directory.Packages.props. Add a
      `profile` mode with one benchmark class per stage - request (Extract(EmlExtractionRequest) vs bytes overload,
      size guard, orchestration), detect, parse, metadata, body (selection + direction), attachments (collection + TNEF
      + container path) - using the internal stage entry points behind the #37 per-stage guards (InternalsVisibleTo
      EmlExtraction.Bench). Inputs: the 5 bench messages plus a fixed list of real samples picked by header count,
      attachment count and TNEF presence, loaded from `--corpus <path>` like #48 (default corpus/internal; visible
      'SKIPPED: public corpus not found at <path>' when absent, synthetic-only benchmarks still run). Config:
      MemoryDiagnoser, ThreadingDiagnoser, EventPipeProfiler (CpuSampling and GcVerbose), Release, runtimes net8.0 and
      net10.0, artifacts to a gitignored artifacts/perf/ folder. Record per stage: mean, allocated bytes/op, gen0/1/2
      per 1000 ops, LOH bytes, and the attachment copy factor (byte[] bytes allocated in the attachments stage / decoded
      attachment bytes, via GC.GetAllocatedBytesForCurrentThread around the stage plus the trace). Reuse #48's corpus
      loader and hardware block (fails when the CPU model is unreadable). Does not write the report (T-profile-report).
    acceptance:
      - "`dotnet run -c Release --project benches/EmlExtraction.Bench -f net10.0 -- profile --corpus <path>` runs every stage benchmark on net8.0 and net10.0 and writes BDN results plus EventPipe traces under artifacts/perf/"
      - "Each stage row reports mean, allocated bytes/op, gen0/1/2 per 1000 ops, lock contentions, and (attachments) the copy factor"
      - "Absent --corpus path prints the SKIPPED line and still runs the synthetic stage benchmarks"
      - "Library builds and tests still pass on net8.0 and net10.0; GoldenKit score 1212/1212; GoldenKit stays net10.0 only"
    test_strategy: >-
      Unit tests for the pure parts (copy-factor computation, sample picker) in the bench test class; smoke run of the
      profile mode with BDN's short-run job on the synthetic set on both TFMs; dotnet test for the library unchanged.
    depends_on:
      - "48:blocks"
      - "30:blocks"
      - "37:blocks"
      - "32:blocks"

  - id: T-profile-trace
    title: "Scripted corpus-level dotnet-trace / dotnet-counters / dotnet-gcdump run over the sweep harness (--corpus)"
    story: S-profiling
    component_refs:
      - ydk:req:quality/profiling-report
      - ydk:nfr:performance/throughput-dop-sweep
      - ydk:nfr:performance/memory-footprint
    spec_refs:
      - quality.md
      - docs/adrs/020-profiling-method.md
      - docs/adrs/015-load-test-method.md
    description: >-
      Size S-M (complexity ~5). Pin dotnet-trace, dotnet-counters and dotnet-gcdump (all MIT, dotnet/diagnostics) in a
      local tool manifest (.config/dotnet-tools.json). Add a script (scripts/profile-corpus.ps1 plus a bash twin, or a
      `profile-trace` mode in the bench that launches itself as a child) that, for each TFM (net8.0, net10.0), runs the
      #48 sweep harness on `--corpus <path>` plus the synthetic set at DOP 1 and DOP = ProcessorCount (Workstation GC;
      Server GC at DOP = cores) under `dotnet-trace collect` (cpu-sampling + gc-verbose), with `dotnet-counters collect`
      writing System.Runtime counters to CSV (gen0/1/2 count, time in GC, GC heap and LOH size, allocation rate), then
      runs the #49 large-file pass and takes a `dotnet-gcdump` at peak. Also records GC.CollectionCount(0/1/2) and
      GC.GetTotalPauseDuration deltas per run. Writes everything to the gitignored artifacts/perf/<date>/ with a
      manifest naming each file, the hardware block and the TFM. Optional: a README note on opening the nettrace in
      PerfView (MIT, Windows) or speedscope.
    acceptance:
      - "One command produces, per TFM, nettrace + counters CSV for DOP 1 and DOP=cores, and a gcdump for the large-file pass, under artifacts/perf/<date>/ with a manifest"
      - "Takes --corpus <path>; an absent path prints the visible SKIPPED line and runs the synthetic set only"
      - "Tools restore from the committed tool manifest; artifacts/perf/ is gitignored"
      - "GC counts and total pause time per run appear in the manifest"
    test_strategy: >-
      Smoke run with a short window on the synthetic set on both TFMs; check the manifest lists every expected file and
      that the nettrace opens (dotnet-trace convert to speedscope succeeds).
    depends_on:
      - "48:blocks"
      - "49:blocks"
      - "30:blocks"

  - id: T-profile-report
    title: "Run the profile on shipped code and commit docs/perf/profile-<date>.md with the top-N hotspot table"
    story: S-profiling
    component_refs:
      - ydk:req:quality/profiling-report
      - ydk:nfr:performance/memory-footprint
      - ydk:nfr:performance/throughput-dop-sweep
    spec_refs:
      - quality.md
      - docs/adrs/020-profiling-method.md
      - docs/adrs/015-load-test-method.md
    description: >-
      Size M (complexity ~5). No human gate: the agent runs T-profile-harness and T-profile-trace on this machine in
      Release on net8.0 and net10.0, passing --corpus C:\Users\yoava\Projects\eml-extraction\corpus\internal (the main
      checkout's gitignored corpus; a task worktree does not have it). Blocked by #50 so the profile reads shipped
      code against the committed baseline. Analyse the traces (BDN EventPipe stacks, dotnet-trace CPU and allocation
      stacks, counters, gcdump) and write docs/perf/profile-<YYYY-MM-DD>.md: hardware block per run (ADR-015 format),
      tool table with versions and licenses, inputs and sample list, per-stage CPU share and alloc share per TFM, GC
      gen0/1/2 counts, total pause time, % time in GC, LOH bytes, attachment copy factor, comparison with
      docs/perf-baseline.json when comparable, and the top-N hotspot table (provisional N = 10: rank, stage, % CPU,
      alloc share, suspected cause, evidence). Raw traces stay in artifacts/perf/ (named, not committed). Set N and the
      run lengths in ADR-020 from what the data needed (drop the provisional marker, cite the run).
    acceptance:
      - "docs/perf/profile-<date>.md committed with every section listed in ydk:req:quality/profiling-report, for net8.0 and net10.0"
      - "Every hotspot row names a stage and evidence (trace frame or benchmark row); stage shares sum to ~100% per TFM"
      - "Hardware block complete; comparability with docs/perf-baseline.json stated"
      - "ADR-020 provisional parameters replaced by the values used, with the source run"
    test_strategy: >-
      Re-run the documented commands once more and check the top-5 hotspots and stage shares agree within run-to-run
      spread; ydk component validate; review the report against the req manifest checklist.
    depends_on:
      - "50:blocks"
      - "T-profile-harness:blocks"
      - "T-profile-trace:blocks"

  # ======================= S-runtime-metrics =======================
  - id: T-runtime-metrics
    title: "Meter 'EmlExtraction' with the seven ADR-021 instruments, MeterListener tests, PII guard, README section"
    story: S-runtime-metrics
    component_refs:
      - ydk:req:observability/runtime-telemetry
      - ydk:crosscut:core/observability
      - ydk:test:observability/telemetry.unit
      - ydk:nfr:observability/metrics-overhead
      - ydk:crosscut:core/library-surface
      - ydk:crosscut:core/warning-format
      - ydk:contract:api/eml-extractor
      - ydk:contract:api/eml-detector
    spec_refs:
      - cross-cutting.md
      - testing.md
      - docs/adrs/021-runtime-metrics-and-tracing.md
    description: >-
      Size M (complexity ~6). Add internal static class EmlExtractionTelemetry holding a static readonly Meter
      ("EmlExtraction", assembly informational version) and the seven instruments of
      ydk:req:observability/runtime-telemetry: extract.duration (s, tag outcome), extract.input.size (By),
      extract.attachments ({attachment}), extract.warnings ({warning}, tag warning.code), detect.calls ({call}, tag
      detect.result), extract.internal_errors ({error}, tags stage + error.type), extract.input_too_large ({request}).
      Record in Extract(EmlExtractionRequest) (#32), at each warning add, in the #37 stage guards and the #38 size
      guard, and in Detect/IsEml (#31). Tag values only from closed sets (constants); skip tag construction when the
      instrument has no listener (Instrument.Enabled). BCL only: no OpenTelemetry/ILogger/EventSource package; check
      with a test on the library's package references. Tests (TDD, ydk:test:observability/telemetry.unit metric cases
      plus NoPiiInTelemetry for metrics) with a real MeterListener filtered to meter name EmlExtraction, in one
      non-parallel xUnit collection; internal fault hook for the internal_error case. README: a "Telemetry" section
      with meter name, instrument table, tag values, PII statement and a 5-line OpenTelemetry AddMeter("EmlExtraction")
      example. Coordinate with #47 (README) if both are open: rebase, do not overwrite.
    acceptance:
      - "MeterListener sees exactly the seven instruments with the ADR-021 names, kinds and units on net8.0 and net10.0"
      - "Clean, part_decode_failed, input_too_large and injected internal_error messages record the values in ydk:test:observability/telemetry.unit"
      - "PII probe (marker in subject, body, addresses, custom header, attachment name, content ID, Content-Location, request FileName): marker absent from every recorded tag"
      - "Library has no OpenTelemetry, Microsoft.Extensions.Logging or EventSource dependency; GoldenKit score 1212/1212; zero internal_error on the golden set"
      - "README Telemetry section present"
    test_strategy: >-
      TDD: write the telemetry.unit metric cases red (dotnet test -f net8.0 and -f net10.0), implement, green. Results
      equality: Extract output identical with and without a listener. GoldenKit score.
    depends_on:
      - "32:blocks"
      - "37:blocks"
      - "38:blocks"
      - "31:blocks"
      - "30:blocks"

  - id: T-runtime-tracing
    title: "ActivitySource 'EmlExtraction': extract activity + per-stage children, ActivityListener tests, span PII guard"
    story: S-runtime-metrics
    component_refs:
      - ydk:req:observability/runtime-telemetry
      - ydk:crosscut:core/observability
      - ydk:test:observability/telemetry.unit
      - ydk:contract:api/eml-extractor
    spec_refs:
      - cross-cutting.md
      - testing.md
      - docs/adrs/021-runtime-metrics-and-tracing.md
    description: >-
      Size S-M (complexity ~4). Add a static readonly ActivitySource ("EmlExtraction", same version) to
      EmlExtractionTelemetry. Start one Internal activity eml_extraction.extract per Extract call with tags input.size,
      attachments.count, warnings.count, outcome; when the parent is sampled, child activities eml_extraction.parse /
      metadata / body / attachments around the #37 guarded stages; a stage recording internal_error sets status Error
      and error.type (never the exception message). No activity for Detect. Null-check StartActivity; no tag work when
      not sampled. Tests: ExtractActivityAndStageChildren, NoListenerNoActivity, InternalErrorCountedByStage (status
      part), and extend NoPiiInTelemetry to spans (names, display names, tags, events, baggage, status description).
      Extend the README Telemetry section with AddSource("EmlExtraction").
    acceptance:
      - "ActivityListener sampling AllData sees eml_extraction.extract with the four tags and the four stage children; none for Detect"
      - "Without a listener Activity.Current stays null inside Extract and results are identical"
      - "Span PII guard passes on net8.0 and net10.0; GoldenKit score 1212/1212"
    test_strategy: "TDD with a real ActivityListener in the telemetry collection; dotnet test both TFMs; GoldenKit score."
    depends_on:
      - "T-runtime-metrics:blocks"
      - "37:blocks"
      - "30:blocks"

  - id: T-metrics-overhead
    title: "Telemetry overhead benchmark: no listener vs MeterListener vs ActivityListener, set the budget from data"
    story: S-runtime-metrics
    component_refs:
      - ydk:nfr:observability/metrics-overhead
      - ydk:req:observability/runtime-telemetry
      - ydk:crosscut:core/observability
    spec_refs:
      - quality.md
      - cross-cutting.md
      - docs/adrs/021-runtime-metrics-and-tracing.md
    description: >-
      Size S (complexity ~4). Add an `overhead` mode to benches/EmlExtraction.Bench (BenchmarkDotNet from
      T-profile-harness, net8.0 + net10.0, MemoryDiagnoser): Extract on tiny, small-20kb and attach-1mb, Detect on tiny,
      each with no listener, a MeterListener enabled on every EmlExtraction instrument, and an ActivityListener
      sampling AllData. Report overhead % and allocation delta per case with the ADR-015 hardware block in
      docs/perf-results.md. Compare with the provisional budget in ydk:nfr:observability/metrics-overhead and replace
      each placeholder with measured value + stated headroom (cite the run). If the zero-listener path allocates or
      exceeds noise, fix the instrumentation in this task; if stage child spans break the listener budget, drop them
      and update ADR-021 and ydk:req:observability/runtime-telemetry ; also smoke-check the #48 sweep T(1) with and
      without a listener.
    acceptance:
      - "Overhead table for all cases and both TFMs committed in docs/perf-results.md"
      - "Zero-listener: 0 added bytes/op and time within noise; listener cases within the budget or the budget/ADR updated with the reason"
      - "ydk:nfr:observability/metrics-overhead has no provisional marker and cites the run"
    test_strategy: "BDN run on both TFMs; re-run once to confirm the verdict is stable; dotnet test unchanged."
    depends_on:
      - "T-runtime-metrics:blocks"
      - "T-runtime-tracing:blocks"
      - "T-profile-harness:blocks"
      - "48:blocks"

  # ======================= S-optimization =======================
  - id: T-opt-triage
    title: "Triage the hotspot report into ranked optimization tasks with hypotheses; set provisional targets"
    story: S-optimization
    component_refs:
      - ydk:req:quality/optimization-evidence
      - ydk:req:quality/profiling-report
      - ydk:nfr:performance/memory-footprint
      - ydk:nfr:performance/throughput-dop-sweep
    spec_refs:
      - quality.md
      - scope.md
      - docs/adrs/022-data-driven-optimization.md
    description: >-
      Size S (complexity ~3). From the committed docs/perf/profile-<date>.md, rank hotspots by expected gain x
      confidence / risk. For each one worth doing, create one task with `ydk task create` under S-optimization
      (title "Optimize <stage>: <change>"), stating: hotspot row, hypothesis (cause, change), metric and expected gain
      relative to docs/perf-baseline.json (#50), the before/after protocol of ADR-022, merge rules (golden 1212/1212,
      both TFMs, no public API change without an ADR, no other ADR-015 metric past the warn threshold, telemetry budget
      intact), and component_refs. Link each new task to T-opt-reprofile as `related`. The ADR-022 candidate areas
      (attachment byte[] copies, MimeKit parse options, header-mapping strings, TNEF buffers, direction regex) become
      tasks only if the report shows them. Add a Targets section to ADR-022 and the targets to
      ydk:nfr:performance/memory-footprint / throughput-dop-sweep, marked provisional. If the report shows the memory
      ceiling exceeded (#51), raise the streaming DEFERRED -> IN decision to the owner instead of creating a task.
    acceptance:
      - "One ydk task per selected hotspot under S-optimization, each with hypothesis, metric, expected gain, protocol and refs"
      - "Each new task linked to T-opt-reprofile as related"
      - "ADR-022 Targets section and NFR targets set (provisional), each traced to a report row"
      - "Hotspots not taken are listed in the report with the reason"
    test_strategy: "ydk task validate-dag passes after creation; ydk component validate; review each task against ydk:req:quality/optimization-evidence"
    depends_on:
      - "T-profile-report:blocks"
      - "T-metrics-overhead:blocks"
      - "51:related"

  - id: T-opt-reprofile
    title: "Closing: re-run sweep and profile after the optimizations, refresh the baseline and limits, record deltas"
    story: S-optimization
    component_refs:
      - ydk:req:quality/optimization-evidence
      - ydk:req:quality/profiling-report
      - ydk:nfr:performance/throughput-dop-sweep
      - ydk:nfr:performance/memory-footprint
      - ydk:req:extraction/max-input-size
    spec_refs:
      - quality.md
      - scope.md
      - docs/adrs/022-data-driven-optimization.md
      - docs/adrs/015-load-test-method.md
    description: >-
      Size M (complexity ~5). The optimization tasks do not exist yet: T-opt-triage creates them and links each here
      as `related` when it is created; this task starts once every linked optimization task is merged or closed.
      Re-run the #48 sweep (both GC modes, net10.0 baseline) and the full profile (T-profile-harness + T-profile-trace,
      both TFMs) on this machine with --corpus C:\Users\yoava\Projects\eml-extraction\corpus\internal. Refresh
      docs/perf-baseline.json via the #50 mechanism (refresh rule: same commit); re-check the #51 limits (maxInputBytes
      default, memory ceiling, A ceiling, threshold) and update them only if the data moved past their headroom. Write a
      new docs/perf/profile-<date>.md with a delta table per optimization (metric, before, after, target met y/n) and
      move ADR-022 targets from provisional to met / not met. If the memory ceiling is now exceeded, raise streaming to
      the owner (scope.md DEFERRED).
    acceptance:
      - "New profile report with the per-optimization delta table and the hardware block"
      - "docs/perf-baseline.json refreshed in the same commit; limits re-checked with the result recorded"
      - "ADR-022 targets marked met / not met with numbers"
      - "Golden 1212/1212 and tests green on both TFMs at the measured commit"
    test_strategy: "Sweep + profile re-run twice to confirm deltas exceed run-to-run spread; baseline comparability check passes on this machine."
    depends_on:
      - "T-opt-triage:blocks"
      - "50:related"
      - "51:related"
